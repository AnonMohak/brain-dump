<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-maskable-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sift turns a messy brain dump into tasks, ideas, reminders and questions." />
    <meta name="color-scheme" content="light dark" />
    <title>Sift</title>
    <script>
      // Set the theme before the first paint (same logic as src/hooks/use-theme.ts).
      try {
        var t = localStorage.getItem('sift:theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.dataset.density = localStorage.getItem('sift:density') || 'comfortable'
        document.documentElement.dataset.accent = localStorage.getItem('sift:accent') || 'violet'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
